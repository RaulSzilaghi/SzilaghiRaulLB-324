repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        name: Code formatieren
        stages: [pre-commit]
        files: \.py$
  - repo: local
    hooks:
      - id: pytest
        name: Tests ausführen
        entry: pytest
        language: system
        stages: [pre-push]
        pass_filenames: false